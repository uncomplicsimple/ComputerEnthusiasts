<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>管理后台 - ComputerEnthusiasts</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
  <div class="container">
    <a class="navbar-brand" href="#">⚙️ ComputerEnthusiasts 管理后台</a>
    <a href="/" class="btn btn-outline-light btn-sm">返回前台</a>
  </div>
</nav>

<div class="container mt-4">
  <!-- 用户管理 -->
  <h3>👥 用户管理</h3>
  <table class="table table-bordered bg-white">
    <thead><tr><th>ID</th><th>用户名</th><th>昵称</th><th>角色</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>
    <tr th:each="u : ${users}">
      <td th:text="${u.id}"></td>
      <td th:text="${u.username}"></td>
      <td th:text="${u.nickname}"></td>
      <td><span th:text="${u.role == 1 ? '管理员' : '普通用户'}" class="badge bg-primary"></span></td>
      <td>
        <span th:if="${u.status == 1}" class="text-success">正常</span>
        <span th:if="${u.status == 0}" class="text-danger">已封禁</span>
      </td>
      <td>
        <button class="btn btn-sm btn-warning" th:onclick="toggleUser([[${u.id}]])">封禁/解封</button>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- 商品管理 -->
  <h3 class="mt-5">📦 商品管理</h3>
  <table class="table table-bordered bg-white">
    <thead><tr><th>ID</th><th>标题</th><th>价格</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>
    <tr th:each="p : ${products}">
      <td th:text="${p.id}"></td>
      <td th:text="${p.title}"></td>
      <td th:text="${p.price}"></td>
      <td><span th:text="${p.status == 1 ? '在售' : (p.status == 0 ? '已下架' : '已售出')}"></span></td>
      <td>
        <button class="btn btn-sm btn-danger" th:onclick="offShelf([[${p.id}]])" th:if="${p.status == 1}">下架</button>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- 帖子管理 -->
  <h3 class="mt-5">📝 帖子管理</h3>
  <table class="table table-bordered bg-white">
    <thead><tr><th>ID</th><th>标题</th><th>内容</th><th>操作</th></tr></thead>
    <tbody>
    <tr th:each="post : ${posts}">
      <td th:text="${post.id}"></td>
      <td th:text="${post.title}"></td>
      <td th:text="${post.content}"></td>
      <td><button class="btn btn-sm btn-danger" th:onclick="deletePost([[${post.id}]])">删除</button></td>
    </tr>
    </tbody>
  </table>
</div>

<script>
  function toggleUser(id) {
    fetch('/admin/user/toggle/' + id, { method: 'POST' })
            .then(res => {
              if (res.status === 403 || res.status === 401) {
                alert("请重新登录管理员账号！");
                return null;
              }
              return res.json();
            })
            .then(data => {
              if (data && data.code === 200) {
                location.reload();
              } else if (data) {
                alert(data.msg || "操作失败");
              }
            })
            .catch(err => {
              console.error(err);
              alert("网络请求失败");
            });
  }

  function offShelf(id) {
    fetch('/admin/product/off-shelf/' + id, { method: 'POST' })
            .then(res => {
              if (res.status === 403 || res.status === 401) {
                alert("请重新登录管理员账号！");
                return null;
              }
              return res.json();
            })
            .then(data => {
              if (data && data.code === 200) {
                location.reload();
              } else if (data) {
                alert(data.msg || "操作失败");
              }
            })
            .catch(err => {
              console.error(err);
              alert("网络请求失败");
            });
  }

  function deletePost(id) {
    if (confirm("确定要删除违规帖子吗？")) {
      fetch('/admin/post/delete/' + id, { method: 'POST' })
              .then(res => {
                if (res.status === 403 || res.status === 401) {
                  alert("请重新登录管理员账号！");
                  return null;
                }
                return res.json();
              })
              .then(data => {
                if (data && data.code === 200) {
                  location.reload();
                } else if (data) {
                  alert(data.msg || "操作失败");
                }
              })
              .catch(err => {
                console.error(err);
                alert("网络请求失败");
              });
    }
  }
</script>
</body>
</html>
