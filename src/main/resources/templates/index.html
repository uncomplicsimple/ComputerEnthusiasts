<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ComputerEnthusiasts</title>
    <!-- 引入 Bootstrap 5 的样式 -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">ComputerEnthusiasts</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <!-- 情况A：已登录 -->
                <li class="nav-item" th:if="${session.loginUser != null}">
                    <span class="nav-link text-light">欢迎，<span th:text="${session.loginUser.nickname}">用户</span></span>
                </li>

                <!-- 交流论坛入口 -->
                <li class="nav-item">
                    <a class="nav-link text-info" href="/post/forum-page">交流论坛</a>
                </li>


                <li class="nav-item" th:if="${session.loginUser!=null}">
                    <a class="nav-link text-warning" href="/cart/page">我的购物车</a>
                </li>

                <!-- 新增：管理员专属入口 -->
                <li class="nav-item" th:if="${session.loginUser != null and session.loginUser.role == 1}">
                    <a class="nav-link text-danger fw-bold" href="/admin/dashboard">👑 管理后台</a>
                </li>

                <li class="nav-item" th:if="${session.loginUser != null}"><a class="nav-link" href="/order/page">我的订单</a></li>

                <li class="nav-item" th:if="${session.loginUser != null}">
                    <a class="nav-link text-warning" href="/product/publish-page">发布配件</a>
                </li>
                <li class="nav-item" th:if="${session.loginUser != null}">
                    <a class="nav-link text-danger" href="/user/logout">退出登录</a>
                </li>

                <!-- 情况B：没登录 -->
                <li class="nav-item" th:if="${session.loginUser == null}">
                    <a class="nav-link" href="/user/login-page">登录</a>
                </li>
                <li class="nav-item" th:if="${session.loginUser == null}">
                    <a class="nav-link" href="/user/register-page">注册</a>
                </li>
            </ul>


        </div>
    </div>
</nav>

<!-- 主体内容 -->
<div class="container mt-5">

    <!-- 搜索与分类区 -->
    <div class="row mb-4">
        <div class="col-md-8">
            <!-- 分类导航 -->
            <div class="btn-group" role="group">
                <a href="/" class="btn btn-outline-dark" th:classappend="${currentCategory == null} ? 'active'">全部</a>
                <a href="/?category=显卡" class="btn btn-outline-dark" th:classappend="${currentCategory == '显卡'} ? 'active'">显卡</a>
                <a href="/?category=CPU" class="btn btn-outline-dark" th:classappend="${currentCategory == 'CPU'} ? 'active'">CPU</a>
                <a href="/?category=主板" class="btn btn-outline-dark" th:classappend="${currentCategory == '主板'} ? 'active'">主板</a>
                <a href="/?category=内存" class="btn btn-outline-dark" th:classappend="${currentCategory == '内存'} ? 'active'">内存</a>
                <a href="/?category=硬盘" class="btn btn-outline-dark" th:classappend="${currentCategory == '硬盘'} ? 'active'">硬盘</a>
                <a href="/?category=其他" class="btn btn-outline-dark" th:classappend="${currentCategory == '其他'} ? 'active'">其他</a>
            </div>
        </div>
        <div class="col-md-4">
            <!-- 关键字搜索 -->
            <form action="/" method="get" class="d-flex">
                <!-- 隐藏域：切换搜索时保留当前分类 -->
                <input type="hidden" name="category" th:value="${currentCategory}">
                <input type="text" class="form-control me-2" name="keyword" th:value="${currentKeyword}" placeholder="搜索商品标题...">
                <button type="submit" class="btn btn-primary">搜索</button>
            </form>
        </div>
    </div>

    <h2 class="mb-4">最新上架配件</h2>
    <div class="row">
        <!-- 使用 Thymeleaf 循环遍历商品列表 -->
        <div class="col-md-4 mb-4" th:each="p : ${products}">
            <a th:href="@{'/product/detail/'+${p.id}}" class="text-decoration-none text-dark">
            <div class="card h-100 shadow-sm">
                <!-- 把 src="https://via.placeholder..." 换成这个 -->
                <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://via.placeholder.com/300x200?text=No+Image'}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="商品图片">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.title}">商品标题</h5>
                    <p class="card-text text-muted" th:text="${p.description}">商品描述</p>
                    <h4 class="text-danger">￥<span th:text="${p.price}">0.00</span></h4>
                </div>
                <div class="card-footer bg-white border-top-0">
                    <small class="text-muted">发布时间：<span th:text="${#temporals.format(p.createTime, 'yyyy-MM-dd HH:mm')}"></span></small>
                </div>
            </div>
            </a>
        </div>
    </div>

    <!-- 如果没数据，显示这个 -->
    <div class="text-center text-muted mt-5" th:if="${#lists.isEmpty(products)}">
        暂无商品，快去发布第一个吧！
    </div>
</div>

<!-- 引入 Bootstrap 的 JS -->
<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
