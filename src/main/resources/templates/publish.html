<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>发布配件 - ComputerEnthusiasts</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">ComputerEnthusiasts</a>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-white">
          <h4 class="mb-0">发布二手配件</h4>
        </div>
        <div class="card-body">
          <!-- 表单提交到 /product/publish-html 接口 -->
          <form action="/product/publish-html" method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">商品标题</label>
              <input type="text" class="form-control" name="title" required placeholder="例如：99新 RTX 3060">
            </div>
            <div class="mb-3">
              <label class="form-label">详细描述</label>
              <textarea class="form-control" name="description" rows="3" placeholder="无矿无修，箱说全..."></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">商品图片</label>
              <input type="file" class="form-control" name="imageFile" accept="image/*">
            </div>

            <div class="mb-3">
              <label class="form-label">价格 (元)</label>
              <input type="number" step="0.01" class="form-control" name="price" required placeholder="1500.00">
            </div>
            <div class="mb-3">
              <label class="form-label">分类</label>
              <select class="form-select" name="category">
                <option value="显卡">显卡</option>
                <option value="CPU">CPU</option>
                <option value="主板">主板</option>
                <option value="内存">内存</option>
                <option value="硬盘">硬盘</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">确认发布</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
